spring.application.name=dimabug

dimabug.storage.materiales-dir=${DIMABUG_STORAGE_MATERIALES_DIR:./uploads/materiales}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

#JWT Paso 2: Configura la clave secreta, 3600000 ms = 1 hora.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

# Diagnostico JWT temporal: retirar cuando se identifique la causa del 401.
logging.level.cl.casol.backend.identidad.infrastructure.security.JwtAuthenticationFilter=DEBUG
logging.level.cl.casol.backend.identidad.infrastructure.security.JwtTokenServiceAdapter=DEBUG
